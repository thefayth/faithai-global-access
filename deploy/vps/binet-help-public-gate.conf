# Public FAITHAI help only. Other BiNet applications retain their launch gate.
set $binet_launch_closed 1;
error_page 419 =200 @binet_worker_reset;
if ($uri ~ "^/(sw\.js|service-worker\.js|binet-app/sw\.js|connect/sw\.js)$") { return 419; }
if ($uri ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$") { set $binet_launch_closed 0; }
if ($uri ~ "^/help(/|$)") { set $binet_launch_closed 0; }
if ($uri ~ "^/help-api/v1(/|$)") { set $binet_launch_closed 0; }
if ($uri ~* "^/(binet-app/)?(api|v1|graphql)(/|$)") { return 401; }
error_page 401 = @binet_beta_locked;
error_page 418 =200 @binet_coming_soon;
if ($binet_launch_closed = 1) { return 418; }

location @binet_beta_locked {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 401 '{"detail":"Private preview. Public access has not been opened."}';
}
location @binet_worker_reset {
    root /srv/binetusa-access-gate/maintenance;
    try_files /service-worker-reset.js =503;
    default_type application/javascript;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location @binet_coming_soon {
    root /srv/binetusa-access-gate/current;
    try_files /index.html =503;
    default_type text/html;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-BiNet-Access "coming-soon" always;
    add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}
