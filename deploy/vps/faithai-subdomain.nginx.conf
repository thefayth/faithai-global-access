server {
    listen 80;
    listen [::]:80;
    server_name faithai.aixyz.tech;

    access_log /var/log/nginx/faithai.access.log;
    error_log /var/log/nginx/faithai.error.log;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

    location = / {
        return 302 /faithai/;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8791/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /faithai-api/ {
        rewrite ^/faithai-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /faithai/sw.js {
        alias /srv/faithai/current/dist/client/sw.js;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /faithai/assets/ {
        alias /srv/faithai/current/dist/client/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /faithai/ {
        alias /srv/faithai/current/dist/client/;
        try_files $uri $uri/ /faithai/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
