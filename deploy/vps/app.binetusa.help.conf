server {
    listen 80;
    listen [::]:80;
    server_name app.binetusa.org;
    include /etc/nginx/snippets/binet-help-public-gate.conf;
    access_log /var/log/nginx/faithai-binetusa.access.log;
    error_log /var/log/nginx/faithai-binetusa.error.log;
    client_max_body_size 64k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

    location = /help { return 302 /help/; }
    # BiNet never forwards identity-related help to the general remote-AI pilot.
    location = /help-api/v1/ai/interpret {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"ok":false,"code":"binet-local-only","provenance":"local"}';
    }
    location ^~ /help-api/v1/ {
        rewrite ^/help-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
    location = /help/sw.js {
        alias /srv/faithai/help/current/dist/client/sw.js;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/help/" always;
    }
    location ^~ /help/assets/ {
        alias /srv/faithai/help/current/dist/client/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /help/ {
        alias /srv/faithai/help/current/dist/client/;
        try_files $uri $uri/ /help/index.html;
        add_header Cache-Control "no-cache" always;
    }
}
